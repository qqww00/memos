syntax = "proto3";

package memos.store;

import "google/protobuf/timestamp.proto";

option go_package = "gen/store";

message MemoPayload {
  Property property = 1;

  Location location = 2;

  repeated string tags = 3;

  // The kanban card state of the memo, if it is on a board.
  KanbanPayload kanban = 4;

  // Audit activities and change history of the memo on boards.
  repeated ActivityPayload activities = 5;

  // The calculated properties from the memo content.
  message Property {
    bool has_link = 1;
    bool has_task_list = 2;
    bool has_code = 3;
    bool has_incomplete_tasks = 4;
    // The title extracted from the first H1 heading, if present.
    string title = 5;
  }

  message Location {
    string placeholder = 1;
    double latitude = 2;
    double longitude = 3;
  }

  message ActivityPayload {
    string type = 1;
    string description = 2;
    google.protobuf.Timestamp create_time = 3;
    string creator = 4;
    optional string old_value = 5;
    optional string new_value = 6;
  }

  // The kanban card state. A memo is a card of at most one board at a time.
  message KanbanPayload {
    // The id of the board this memo belongs to.
    string board_id = 1;
    // The id of the board column this memo sits in.
    string column_id = 2;
    // The fractional ordering of the memo within the column.
    double position = 3;
    // The card category name.
    optional string category = 4;
    // The card category color hex.
    optional string category_color_hex = 5;
    // The card due time.
    optional google.protobuf.Timestamp due_time = 6;
    // Whether the card is closed.
    optional bool is_closed = 7;
    // Multiple category labels.
    repeated string categories = 8;
    // The card milestone name.
    optional string milestone = 9;
    // The card milestone color hex.
    optional string milestone_color_hex = 10;
  }
}
